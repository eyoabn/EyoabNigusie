<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eyoab Nigusie — Full-Stack &amp; Flutter Developer</title>
    <meta
      name="description"
      content="Portfolio of Eyoab Nigusie, a software engineer from Adama, Ethiopia specializing in Full-Stack Web Development and cross-platform Flutter mobile apps."
    />
    <meta name="author" content="Eyoab Nigusie" />
    <link rel="canonical" href="https://eyoabnigusie.vercel.app/" />

    <!-- Project images live on Unsplash. Opening the connection here overlaps DNS
         and TLS with bundle parsing instead of waiting until React asks for them. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Favicon: inline SVG so there's no extra request and it scales cleanly. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300d4ff'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230f0f0f'/%3E%3Ctext x='50' y='68' font-family='system-ui,sans-serif' font-size='46' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/profile.jpg" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />

    <!-- Open Graph: what LinkedIn, Telegram, Slack, and Facebook show when the link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eyoab Nigusie" />
    <meta property="og:url" content="https://eyoabnigusie.vercel.app/" />
    <meta property="og:title" content="Eyoab Nigusie — Full-Stack &amp; Flutter Developer" />
    <meta
      property="og:description"
      content="Software engineer from Adama, Ethiopia specializing in Full-Stack Web Development and cross-platform Flutter mobile apps."
    />
    <meta property="og:image" content="https://eyoabnigusie.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portrait of Eyoab Nigusie" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eyoab Nigusie — Full-Stack &amp; Flutter Developer" />
    <meta
      name="twitter:description"
      content="Software engineer from Adama, Ethiopia specializing in Full-Stack Web Development and cross-platform Flutter mobile apps."
    />
    <meta name="twitter:image" content="https://eyoabnigusie.vercel.app/og-image.jpg" />

    <!-- Structured data so search engines can render a person/knowledge panel. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Eyoab Nigusie",
        "url": "https://eyoabnigusie.vercel.app/",
        "image": "https://eyoabnigusie.vercel.app/profile.jpg",
        "email": "mailto:eyoabnigusie@gmail.com",
        "jobTitle": "Full-Stack Developer",
        "description": "Software engineer building Full-Stack web products and cross-platform Flutter apps.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Adama",
          "addressCountry": "ET"
        },
        "knowsAbout": [
          "Software Engineering",
          "Machine Learning",
          "Flutter",
          "React",
          "Full-Stack Development"
        ],
        "sameAs": ["https://github.com/eyoabn"]
      }
    </script>

    <!-- Applies the saved theme before first paint. Without this the page renders
         in the default theme for a frame and then flips, which reads as a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>Eyoab Nigusie — Software Engineer</h1>
        <p>
          This portfolio needs JavaScript enabled. You can still reach me at
          <a href="mailto:eyoabnigusie@gmail.com">eyoabnigusie@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
